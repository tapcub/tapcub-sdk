org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
kotlin.code.style=official

# Maven Central（Central Portal）发布，com.vanniktech.maven.publish 读取；各模块的 POM_ARTIFACT_ID / POM_NAME / POM_DESCRIPTION 在模块自己的 gradle.properties
# CI 用 ORG_GRADLE_PROJECT_mavenCentralUsername / mavenCentralPassword / signingInMemoryKey / signingInMemoryKeyPassword 传凭证（release-maven.yml）
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true
RELEASE_SIGNING_ENABLED=true
GROUP=com.tapcub
POM_INCEPTION_YEAR=2026
POM_URL=https://tapcub.com
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/license/mit
POM_LICENCE_DIST=repo
POM_SCM_URL=https://github.com/tapcub/tapcub-sdk/tree/main/packages/android
POM_SCM_CONNECTION=scm:git:https://github.com/tapcub/tapcub-sdk.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/tapcub/tapcub-sdk.git
POM_DEVELOPER_ID=tapcub
POM_DEVELOPER_NAME=TapCub
POM_DEVELOPER_URL=https://tapcub.com
