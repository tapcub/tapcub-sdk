name: tapcub_flutter
description: >-
  TapCub analytics for Flutter: events, screens, sessions, user identity,
  consent and crash reporting, bridged to the native TapCub iOS and Android SDKs.
version: 0.2.0
homepage: https://tapcub.com
repository: https://github.com/tapcub/tapcub-sdk/tree/main/packages/tapcub_flutter
issue_tracker: https://github.com/tapcub/tapcub-sdk/issues
topics:
  - analytics
  - tracking
  - events
  - consent
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.tapcub.flutter
        pluginClass: TapCubFlutterPlugin
      ios:
        pluginClass: TapCubFlutterPlugin
