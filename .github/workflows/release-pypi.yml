name: release-pypi

# PyPI release of tapcub (the Python server SDK), triggered by a `python-v<version>` tag (`pnpm sdk:sync -- --push --tag python-v0.1.0`).
# Uses a PyPI Trusted Publisher (OIDC), so no API token is needed.
#
# One-time setup: pypi.org → project tapcub → Manage → Publishing → Add a new publisher → GitHub
#   Owner: tapcub   Repository: tapcub-sdk   Workflow: release-pypi.yml   Environment: pypi
# Create the `pypi` environment under the repository's Settings → Environments.

on:
  push:
    tags: ['python-v*']

concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          actual=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' packages/sdk-server/python/pyproject.toml)
          [ "$actual" = "$version" ] || { echo "::error::pyproject.toml version is $actual, tag says $version"; exit 1; }
      - run: python -m pip install --upgrade build
      - run: python -m build packages/sdk-server/python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
